========================= */

.approved-petal {

    height: 62px;

    object-fit: contain;

    z-index: 15;

    cursor: pointer;

    filter:
        drop-shadow(
            0 3px 5px rgba(80, 110, 120, 0.18)
        );

    --rotation: 0deg;

    --move-x: 20px;

    --move-y: -18px;

    --speed: 8s;

    --delay: 0s;

    animation:
        approvedDrift
        var(--speed)
        ease-in-out
        infinite
        alternate;

    animation-delay:
        var(--delay);

    transition:
        filter 0.2s ease;

}


.approved-petal:hover {

    filter:
        drop-shadow(
            0 5px 8px rgba(80, 110, 120, 0.25)
        )
        brightness(1.03);

}


@keyframes approvedDrift {

    0% {

        transform:
            translate(0, 0)
            rotate(var(--rotation));

    }

    100% {

        transform:
            translate(
                var(--move-x),
                var(--move-y)
            )
            rotate(
                calc(
                    var(--rotation)
                    + 18deg
                )
            );

    }

/* =========================
   CHARACTER COUNTER
========================= */

message.addEventListener(
    "input",
    () => {

        counter.textContent =
            `${message.value.length} / 250`;

    }
);

message.addEventListener("focus", () => {
    message.placeholder = "";
});

message.addEventListener("blur", () => {
    if (message.value === "") {
        message.placeholder = "Write something you love...";
    }
});


/* =========================
   MODAL
========================= */

function openModal(content) {

    modalContent.innerHTML =
        content;

    modalOverlay.classList.add(
        "show"
    );

}


function closeModal() {

    modalOverlay.classList.remove(
        "show"
    );

}


modalClose.addEventListener(
    "click",
    closeModal
);


modalOverlay.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            modalOverlay
        ) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Escape" &&
            modalOverlay.classList.contains(
                "show"
            )
        ) {

            closeModal();

        }

    }
);


/* =========================
   SUBMIT PETAL
========================= */

submitButton.addEventListener(
    "click",
    async () => {

        const text =
            message.value.trim();


        if (text === "") {

            openModal(`

                <p class="confirmation-message">

                    Write a little something first.

                </p>

            `);

            return;

        }


        const { error } =
            await supabaseClient
                .from("petals")
                .insert({
                    message: text,
                    approved: false,
                    deleted_at: null
                });


        if (error) {

            console.error(
                "Supabase error:",
                error
            );

            return;

        }


        message.value = "";


        counter.textContent =
            "0 / 250";


        openModal(`

            <p class="confirmation-message">

                Your petal is waiting to bloom.

            </p>

            <p class="confirmation-subtext">

                Thank you for leaving
                a little piece of love behind.

            </p>

        `);

    }
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}

/* =========================
   APPROVED PETALS
========================= */

async function showApprovedPetals() {

    const { data: savedPetals, error } =
        await supabaseClient
            .from("petals")
            .select("*")
            .eq("approved", true)
            .is("deleted_at", null);


    if (error) {

        console.error(
            "Supabase error:",
            error
        );

        return;

    }


    // Only approved and non-deleted petals
    const approvedPetals =
        savedPetals.filter(
            petal =>
                petal.approved &&
                !petal.deleted_at
        );


    // Total approved petals
    petalCount.textContent =
        approvedPetals.length;


    // Remove any currently visible petals
    document
        .querySelectorAll(
            ".approved-petal"
        )
        .forEach(
            petal =>
                petal.remove()
        );


    // Desktop = 25
    // Mobile = 12
    const isMobile =
        window.innerWidth <= 800;


    const MAX_VISIBLE =
        isMobile ? 12 : 25;


    // If there aren't enough approved petals,
    // simply show all of them.
    const visibleCount =
        Math.min(
            MAX_VISIBLE,
            approvedPetals.length
        );


    // Shuffle everything
    const shuffled =
        [...approvedPetals]
            .sort(
                () =>
                    Math.random() - 0.5
            );


    // New random set every page load
    const initialPetals =
        shuffled.slice(
            0,
            visibleCount
        );


    initialPetals.forEach(
        petal => {

            createApprovedPetal(
                petal
            );

        }
    );


    // Only start rotation if there
    // are more petals available
    if (
        approvedPetals.length >
        visibleCount
    ) {

        startPetalRotation(
            approvedPetals
        );

    }

}


/* =========================
   CREATE APPROVED PETAL
========================= */

function createApprovedPetal(
    petal
) {

    const newPetal =
        document.createElement(
            "img"
        );


    newPetal.className =
        "approved-petal";


    // Remember which message this petal represents
    newPetal.dataset.message =
        petal.message;


    // Random hand-drawn petal
    const randomPetal =
        petalImages[
            Math.floor(
                Math.random() *
                petalImages.length
            )
        ];


    newPetal.src =
        `petals/${randomPetal}`;


    newPetal.alt =
        "A petal";


    // Random position
    const top =
        8 +
        Math.random() * 84;


    const left =
        4 +
        Math.random() * 92;


    newPetal.style.top =
        `${top}%`;


    newPetal.style.left =
        `${left}%`;


    // Random rotation
    const rotation =
        Math.floor(
            Math.random() * 360
        );


    // Random movement
    const moveX =
        (Math.random() - 0.5) *
        80;


    const moveY =
        (Math.random() - 0.5) *
        80;


    // Random speed
    const speed =
        8 +
        Math.random() * 8;


    // Random animation starting point
    const delay =
        Math.random() * -8;


    newPetal.style.setProperty(
        "--rotation",
        `${rotation}deg`
    );


    newPetal.style.setProperty(
        "--move-x",
        `${moveX}px`
    );


    newPetal.style.setProperty(
        "--move-y",
        `${moveY}px`
    );


    newPetal.style.setProperty(
        "--speed",
        `${speed}s`
    );


    newPetal.style.setProperty(
        "--delay",
        `${delay}s`
    );


    // Click the petal
    newPetal.addEventListener(
        "click",
        () => {

            const date =
                new Date(
                    petal.created_at
                );


            const formattedDate =
                date.toLocaleDateString(
                    undefined,
                    {
                        year: "numeric",

                        month: "long",

                        day: "numeric"
                    }
                );


            openModal(`

                <p class="petal-message">

                    ${escapeHTML(
                        petal.message
                    )}

                </p>

                <p class="petal-date">

                    This petal bloomed on
                    ${formattedDate}.

                </p>

            `);

        }
    );


    document
        .querySelector(
            ".page"
        )
        .appendChild(
            newPetal
        );


    // The petal stays for a random amount
    // of time before leaving.
    const lifetime =
        15000 +
        Math.random() * 15000;


    setTimeout(
        () => {

            if (
                newPetal.parentNode
            ) {

                newPetal.remove();

            }

        },
        lifetime
    );

}


/* =========================
   CONTINUOUS PETAL ROTATION
========================= */

function startPetalRotation(
    approvedPetals
) {

    const isMobile =
        window.innerWidth <= 800;


    const MAX_VISIBLE =
        isMobile ? 12 : 25;


    setInterval(
        () => {

            const currentPetals =
                document.querySelectorAll(
                    ".approved-petal"
                );


            // Never exceed the maximum
            if (
                currentPetals.length >=
                MAX_VISIBLE
            ) {

                return;

            }


            // Messages currently visible
            const visibleMessages =
                Array.from(
                    currentPetals
                ).map(
                    petal =>
                        petal.dataset.message
                );


            // Find petals that aren't
            // currently on screen
            const available =
                approvedPetals.filter(
                    petal =>
                        !visibleMessages.includes(
                            petal.message
                        )
                );


            if (
                available.length === 0
            ) {

                return;

            }


            // Choose a random new petal
            const nextPetal =
                available[
                    Math.floor(
                        Math.random() *
                        available.length
                    )
                ];


            createApprovedPetal(
                nextPetal
            );

        },

        4000
    );

}

/* =========================
   RANDOMIZE DECORATIVE PETALS
========================= */

const decorativePetals =
    document.querySelectorAll(".decorative-petal");

const positions = [];

decorativePetals.forEach(petal => {

    let top;
    let left;
    let tooClose;

    // Find a random position that isn't
    // too close to another petal
    do {

        top =
            5 + Math.random() * 88;

        left =
            3 + Math.random() * 94;

        tooClose =
            positions.some(position => {

                const distance =
                    Math.sqrt(
                        Math.pow(
                            left - position.left,
                            2
                        ) +
                        Math.pow(
                            top - position.top,
                            2
                        )
                    );

                return distance < 12;
            });

    } while (tooClose);


    positions.push({
        top: top,
        left: left
    });


    // Random rotation
    const rotation =
        Math.random() * 360;


    petal.style.top =
        `${top}%`;

    petal.style.left =
        `${left}%`;

    petal.style.rotate =
        `${rotation}deg`;

});


showApprovedPetals();

</script>
